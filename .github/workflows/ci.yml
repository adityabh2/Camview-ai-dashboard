name: CAMVIEW CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: camview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BACKEND TESTS
  # ============================================================

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run backend tests
        working-directory: backend
        run: |
          set -e

          if [ -d tests ]; then
            pytest \
              -q \
              --durations=10 \
              --junitxml=../test-results.xml
          else
            echo "No backend tests directory found."
            python -m compileall -q .
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: test-results.xml
          if-no-files-found: ignore

  # ============================================================
  # FRONTEND CHECK
  # ============================================================

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          count=0

          if [ ! -d frontend/js ]; then
            echo "frontend/js does not exist."
            exit 0
          fi

          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            node --experimental-detect-module --check "$file" 2>/dev/null \
              || node --check "$file"

            count=$((count + 1))
          done < <(find frontend/js -name '*.js' -print0)

          echo "Checked $count JavaScript files"

  # ============================================================
  # DOCKER BUILD + SMOKE TEST
  # ============================================================

  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CAMVIEW image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: camview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -e

          docker run -d \
            --name camview-ci \
            -p 5000:5000 \
            -e CAMVIEW_MODE=demo \
            -e CAMVIEW_DEMO_USERS=1 \
            -e CAMVIEW_SECRET_KEY=test-secret-for-ci \
            -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
            camview:ci

          echo "Waiting for CAMVIEW..."

          SUCCESS=0

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:5000/api/auth/session \
              > /tmp/session.json; then

              echo "CAMVIEW is responding."
              SUCCESS=1
              break
            fi

            echo "Waiting... $i/30"
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "CAMVIEW failed to start."
            docker ps -a
            docker logs camview-ci || true
            exit 1
          fi

          cat /tmp/session.json

          grep -q '"mode":"demo"' /tmp/session.json

          curl -fsS \
            http://127.0.0.1:5000/ \
            > /dev/null

          echo "Smoke test passed."

      - name: Container logs
        if: always()
        run: |
          docker logs camview-ci || true

  # ============================================================
  # PUBLISH TO GITHUB CONTAINER REGISTRY
  # ============================================================

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - image

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CAMVIEW
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/camview-ai-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/camview-ai-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY EC2
  # ============================================================

  deploy:
    name: Deploy CAMVIEW to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish]

    # never cancel a deployment half-way (the top-level concurrency cancels older runs)
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read            # the job's own token pulls the image from GHCR — no extra secret needed

    env:
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}

    steps:
      - name: Image to deploy
        id: img
        run: |
          # same tag the publish job pushes: ghcr.io/<owner>/camview-ai-dashboard:<commit sha>
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/camview-ai-dashboard:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check the server is reachable
        env:
          HOST: ${{ secrets.SERVER_IP }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Secret SERVER_IP is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if ! timeout 15 bash -c "echo > /dev/tcp/$HOST/$SERVER_PORT"; then
            echo "::error::GitHub Actions cannot reach the server on port $SERVER_PORT. In AWS: EC2 > Security Groups > Inbound rules > SSH (port $SERVER_PORT) must allow source 0.0.0.0/0 (key-only login), not only your own IP."
            exit 1
          fi
          echo "Server reachable on port $SERVER_PORT"

      - name: Deploy CAMVIEW
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: 60s
          command_timeout: 10m
          envs: IMAGE,GHCR_USER,GHCR_PULL_TOKEN
          script: |
            set -e
            APP_DIR=/opt/camview
            CONTAINER=camview

            echo "== CAMVIEW deployment: $IMAGE"

            # All settings (API key, project, admin, secret key) live in a file ON THE SERVER only,
            # never in GitHub. Create it once — see README "Deploy to a server".
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: $APP_DIR/.env is missing on the server. Create it once (copy your local .env) and re-run."
              exit 1
            fi

            if docker info >/dev/null 2>&1; then DOCKER=docker; else DOCKER="sudo docker"; fi

            echo "$GHCR_PULL_TOKEN" | $DOCKER login ghcr.io -u "$GHCR_USER" --password-stdin
            $DOCKER pull "$IMAGE"
            $DOCKER logout ghcr.io >/dev/null 2>&1 || true

            # keep users, clients, tickets and the audit trail across deployments
            $DOCKER volume create camview_data >/dev/null

            $DOCKER rm -f "$CONTAINER" >/dev/null 2>&1 || true
            $DOCKER run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file "$APP_DIR/.env" \
              -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
              -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
              -e PORT=5000 \
              -v camview_data:/app/backend/data \
              "$IMAGE"

            echo "== Waiting for the application"
            ok=""
            for i in $(seq 1 45); do
              if curl -fsS http://localhost:5000/api/auth/session -o /tmp/camview-session.json; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "ERROR: the application did not answer"
              $DOCKER logs --tail 80 "$CONTAINER"
              exit 1
            fi

            if ! grep -Eq '"mode": *"live"' /tmp/camview-session.json; then
              echo "ERROR: running, but not in LIVE mode — set CAMVIEW_MODE=live and CAMVIEW_API_KEY in $APP_DIR/.env"
              cat /tmp/camview-session.json
              exit 1
            fi

            $DOCKER image prune -f >/dev/null 2>&1 || true
            $DOCKER ps --filter "name=$CONTAINER"
            $DOCKER logs --tail 30 "$CONTAINER"
            echo "== CAMVIEW deployed (LIVE)"
