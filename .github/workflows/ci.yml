name: CAMVIEW CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: camview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BACKEND TESTS
  # ============================================================

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run backend tests
        working-directory: backend
        run: |
          set -e

          if [ -d tests ]; then
            pytest \
              -q \
              --durations=10 \
              --junitxml=../test-results.xml
          else
            echo "No backend tests directory found."
            python -m compileall -q .
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: test-results.xml
          if-no-files-found: ignore

  # ============================================================
  # FRONTEND CHECK
  # ============================================================

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          count=0

          if [ ! -d frontend/js ]; then
            echo "frontend/js does not exist."
            exit 0
          fi

          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            node --experimental-detect-module --check "$file" 2>/dev/null \
              || node --check "$file"

            count=$((count + 1))
          done < <(find frontend/js -name '*.js' -print0)

          echo "Checked $count JavaScript files"

  # ============================================================
  # DOCKER BUILD + SMOKE TEST
  # ============================================================

  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CAMVIEW image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: camview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -e

          docker run -d \
            --name camview-ci \
            -p 5000:5000 \
            -e CAMVIEW_MODE=demo \
            -e CAMVIEW_DEMO_USERS=1 \
            -e CAMVIEW_SECRET_KEY=test-secret-for-ci \
            -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
            camview:ci

          echo "Waiting for CAMVIEW..."

          SUCCESS=0

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:5000/api/auth/session \
              > /tmp/session.json; then

              echo "CAMVIEW is responding."
              SUCCESS=1
              break
            fi

            echo "Waiting... $i/30"
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "CAMVIEW failed to start."
            docker ps -a
            docker logs camview-ci || true
            exit 1
          fi

          cat /tmp/session.json

          grep -q '"mode":"demo"' /tmp/session.json

          curl -fsS \
            http://127.0.0.1:5000/ \
            > /dev/null

          echo "Smoke test passed."

      - name: Container logs
        if: always()
        run: |
          docker logs camview-ci || true

  # ============================================================
  # PUBLISH TO GITHUB CONTAINER REGISTRY
  # ============================================================

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - image

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CAMVIEW
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/camview-ai-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/camview-ai-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY EC2
  # ============================================================

  deploy:
    name: Deploy CAMVIEW to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
