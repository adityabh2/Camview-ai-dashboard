name: CAMVIEW CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camview-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# BACKEND TESTS
# ============================================================

jobs:

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte compile
        run: |
          python -m compileall -q .

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest -q \
            -p no:cacheprovider \
            --durations=10 \
            --junitxml=../test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
          if-no-files-found: ignore


# ============================================================
# FRONTEND CHECK
# ============================================================

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript
        run: |
          set -e

          count=0

          while IFS= read -r -d '' f; do
            node --experimental-detect-module --check "$f" 2>/dev/null || node --check "$f"
            count=$((count + 1))
          done < <(find frontend/js -name '*.js' -print0)

          echo "Checked $count JavaScript files"


# ============================================================
# DOCKER BUILD + SMOKE TEST
# ============================================================

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: camview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -e

          docker run -d \
            --name camview-ci \
            -p 5000:5000 \
            -e CAMVIEW_MODE=demo \
            -e CAMVIEW_DEMO_USERS=1 \
            -e CAMVIEW_SECRET_KEY=ci-only-secret \
            -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
            -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
            camview:ci

          echo "Waiting for application..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://localhost:5000/api/auth/session \
              > /tmp/session.json; then

              echo "Application started"
              break
            fi

            sleep 2

          done

          cat /tmp/session.json

          grep -q '"mode": *"demo"' /tmp/session.json

          curl -fsS http://localhost:5000/ > /dev/null

          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: |
          docker logs camview-ci || true


# ============================================================
# PUBLISH TO GITHUB CONTAINER REGISTRY
# ============================================================

  publish:
    name: Publish Docker image

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - image

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


# ============================================================
# PRODUCTION DEPLOYMENT
# ============================================================

  deploy:
    name: Deploy CAMVIEW to production

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - publish

    steps:

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2

        with:

          # --------------------------------------------------
          # SERVER CONNECTION
          # --------------------------------------------------

          host: ${{ secrets.SERVER_IP }}

          username: ${{ secrets.SERVER_USER }}

          key: ${{ secrets.SERVER_SSH_KEY }}

          port: 22

          timeout: 60s

          command_timeout: 10m


          # --------------------------------------------------
          # SERVER COMMANDS
          # --------------------------------------------------

          script: |

            set -e

            echo ""
            echo "=========================================="
            echo " CAMVIEW PRODUCTION DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Server:"
            hostname

            echo ""
            echo "Docker:"
            docker --version


            # ------------------------------------------------
            # VARIABLES
            # ------------------------------------------------

            IMAGE="ghcr.io/adityabh2/camview-ai-dashboard:latest"

            CONTAINER="camview"


            # ------------------------------------------------
            # LOGIN TO GHCR
            # ------------------------------------------------

            echo ""
            echo "Logging into GitHub Container Registry..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              --username "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            # ------------------------------------------------
            # PULL LATEST IMAGE
            # ------------------------------------------------

            echo ""
            echo "Pulling latest CAMVIEW image..."

            docker pull "$IMAGE"


            # ------------------------------------------------
            # STOP OLD APPLICATION
            # ------------------------------------------------

            echo ""
            echo "Stopping old CAMVIEW container..."

            docker rm -f "$CONTAINER" 2>/dev/null || true


            # ------------------------------------------------
            # REMOVE TEST CONTAINER
            # ------------------------------------------------

            echo ""
            echo "Removing test container..."

            docker rm -f camview-test 2>/dev/null || true


            # ------------------------------------------------
            # START PRODUCTION APPLICATION
            # ------------------------------------------------

            echo ""
            echo "Starting CAMVIEW in LIVE mode..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5000:5000 \
              -e CAMVIEW_MODE=live \
              -e CAMVIEW_SECRET_KEY="${{ secrets.CAMVIEW_SECRET_KEY }}" \
              -e CAMVIEW_API_KEY="${{ secrets.CAMVIEW_API_KEY }}" \
              -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
              "$IMAGE"


            # ------------------------------------------------
            # WAIT FOR APPLICATION
            # ------------------------------------------------

            echo ""
            echo "Waiting for CAMVIEW..."

            SUCCESS=0

            for i in $(seq 1 30); do

              if curl -fsS \
                http://localhost:5000/api/auth/session \
                > /tmp/camview-session.json; then

                SUCCESS=1
                echo "CAMVIEW is responding."

                break

              fi

              echo "Waiting... attempt $i/30"

              sleep 2

            done


            # ------------------------------------------------
            # FAIL IF APPLICATION DID NOT START
            # ------------------------------------------------

            if [ "$SUCCESS" -ne 1 ]; then

              echo ""
              echo "CAMVIEW failed to start."

              docker ps -a

              docker logs "$CONTAINER" || true

              exit 1

            fi


            # ------------------------------------------------
            # CHECK LIVE MODE
            # ------------------------------------------------

            echo ""
            echo "CAMVIEW session response:"

            cat /tmp/camview-session.json

            echo ""
            echo "Checking LIVE mode..."

            grep -q '"mode":"live"' \
              /tmp/camview-session.json


            # ------------------------------------------------
            # CHECK CONTAINER
            # ------------------------------------------------

            echo ""
            echo "Container status:"

            docker ps \
              --filter "name=camview"


            # ------------------------------------------------
            # CHECK ENVIRONMENT
            # ------------------------------------------------

            echo ""
            echo "CAMVIEW configuration:"

            docker exec "$CONTAINER" \
              env | grep -E \
              '^CAMVIEW_MODE=|^CAMVIEW_DB_PATH='


            # ------------------------------------------------
            # SHOW LOGS
            # ------------------------------------------------

            echo ""
            echo "Recent CAMVIEW logs:"

            docker logs --tail 50 "$CONTAINER"


            # ------------------------------------------------
            # DONE
            # ------------------------------------------------

            echo ""
            echo "=========================================="
            echo " CAMVIEW DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
