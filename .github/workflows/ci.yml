  deploy:
    name: Deploy to production server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish]

    steps:
      - name: Deploy Camview
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 13.234.66.181
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "Connected to Camview server"

            sudo mkdir -p /opt/camview
            sudo chown -R ubuntu:ubuntu /opt/camview

            cd /opt/camview

            echo "Pulling latest Camview image..."

            docker pull ghcr.io/${{ github.repository }}:latest

            echo "Stopping old container..."

            docker rm -f camview || true

            echo "Starting Camview..."

            docker run -d \
              --name camview \
              --restart unless-stopped \
              -p 5000:5000 \
              -e CAMVIEW_MODE=production \
              -e CAMVIEW_SECRET_KEY="CHANGE_ME" \
              -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
              ghcr.io/${{ github.repository }}:latest

            echo "Container status:"
            docker ps --filter "name=camview"

            echo "Recent logs:"
            docker logs --tail 50 camview

            echo "Deployment successful!"
