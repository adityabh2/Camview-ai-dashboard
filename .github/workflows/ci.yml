# CAMVIEW Command Center — CI / CD pipeline
#
#   every push and pull request:
#     1. backend    Python 3.12 (same as the Docker image): byte-compile + the full pytest suite
#                   (demo mode, temporary databases, Camview is mocked — no secrets needed)
#     2. frontend   syntax check of every ES module (no build step exists)
#     3. image      docker build + smoke test: the container starts in demo mode, signs in, serves the API
#   push to main / a v* tag (after 1–3 pass):
#     4. publish    the image to GitHub Container Registry: ghcr.io/<owner>/<repo>:latest, :sha-…, :v1.2.3
#
# Nothing here reads the Camview API key or any .env file: the image never contains one
# (.dockerignore excludes **/.env and **/*.db); production settings are passed at run time.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q .

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q -p no:cacheprovider --durations=10 --junitxml=../test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every ES module
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            node --experimental-detect-module --check "$f" 2>/dev/null || node --check "$f"
            count=$((count + 1))
          done < <(find frontend/js -name '*.js' -print0)
          echo "Checked $count JavaScript files"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: camview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          set -e
          docker run -d --name camview -p 5000:5000 \
            -e CAMVIEW_MODE=demo -e CAMVIEW_DEMO_USERS=1 -e CAMVIEW_SECRET_KEY=ci-only-secret \
            -e CAMVIEW_DB_PATH=/app/backend/data/camview.db -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
            camview:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/auth/session > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5000/api/auth/session | grep -q '"mode": *"demo"'
          curl -fsS -o /dev/null http://localhost:5000/
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"email":"supervisor@demo.camview","password":"demo"}' http://localhost:5000/api/auth/login > /dev/null
          curl -fsS -b jar "http://localhost:5000/api/queue/summary" | grep -q '"totals"'
          curl -fsS -b jar "http://localhost:5000/api/status" | grep -q '"dataVersion"'
          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs camview || true

  publish:
    name: Publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
