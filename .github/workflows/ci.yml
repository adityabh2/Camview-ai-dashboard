```yaml
name: CAMVIEW CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camview-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# BACKEND
# ============================================================

jobs:

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte compile
        run: |
          python -m compileall -q .

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest -q \
            -p no:cacheprovider \
            --durations=10 \
            --junitxml=../test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
          if-no-files-found: ignore


# ============================================================
# FRONTEND
# ============================================================

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          count=0

          while IFS= read -r -d '' file; do

            node --experimental-detect-module --check "$file" 2>/dev/null \
              || node --check "$file"

            count=$((count + 1))

          done < <(find frontend/js -name '*.js' -print0)

          echo "Checked $count JavaScript files"


# ============================================================
# DOCKER BUILD
# ============================================================

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: camview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |

          set -e

          docker run -d \
            --name camview \
            -p 5000:5000 \
            -e CAMVIEW_MODE=demo \
            -e CAMVIEW_DEMO_USERS=1 \
            -e CAMVIEW_SECRET_KEY=ci-only-secret \
            -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
            -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
            camview:ci

          echo "Waiting for CAMVIEW..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://localhost:5000/api/auth/session \
              > /dev/null; then

              echo "CAMVIEW is responding."
              break

            fi

            sleep 2

          done

          curl -fsS \
            http://localhost:5000/api/auth/session \
            | grep -q '"mode": *"demo"'

          curl -fsS \
            -o /dev/null \
            http://localhost:5000/

          curl -fsS \
            -c jar \
            -H 'Content-Type: application/json' \
            -d '{"email":"supervisor@demo.camview","password":"demo"}' \
            http://localhost:5000/api/auth/login \
            > /dev/null

          curl -fsS \
            -b jar \
            http://localhost:5000/api/queue/summary \
            | grep -q '"totals"'

          curl -fsS \
            -b jar \
            http://localhost:5000/api/status \
            | grep -q '"dataVersion"'

          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: |
          docker logs camview || true


# ============================================================
# PUBLISH GHCR
# ============================================================

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - image

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


# ============================================================
# DEPLOY EC2
# ============================================================

  deploy:
    name: Deploy CAMVIEW to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - publish

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:

          # YOUR EXISTING GITHUB SECRET
          host: ${{ secrets.SERVER_IP }}

          # EC2 UBUNTU USER
          username: ubuntu

          # SSH
          port: 22
          protocol: tcp4

          # YOUR EXISTING PEM SECRET
          key: ${{ secrets.SERVER_SSH_KEY }}

          timeout: 120s
          command_timeout: 10m

          script: |

            set -e

            echo "=========================================="
            echo " CAMVIEW PRODUCTION DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Server:"
            hostname

            echo ""
            echo "Docker:"
            docker --version


            # ------------------------------------------------
            # VARIABLES
            # ------------------------------------------------

            IMAGE="ghcr.io/adityabh2/camview-ai-dashboard:latest"
            CONTAINER="camview"


            # ------------------------------------------------
            # LOGIN GHCR
            # ------------------------------------------------

            echo ""
            echo "Logging into GHCR..."

            echo "${GHCR_TOKEN}" | \
              docker login ghcr.io \
              --username "${GHCR_USERNAME}" \
              --password-stdin


            # ------------------------------------------------
            # PULL IMAGE
            # ------------------------------------------------

            echo ""
            echo "Pulling latest CAMVIEW image..."

            docker pull "$IMAGE"


            # ------------------------------------------------
            # STOP OLD CONTAINER
            # ------------------------------------------------

            echo ""
            echo "Removing existing CAMVIEW container..."

            docker rm -f "$CONTAINER" 2>/dev/null || true


            # ------------------------------------------------
            # START APPLICATION
            # ------------------------------------------------

            echo ""
            echo "Starting CAMVIEW..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5000:5000 \
              -e CAMVIEW_MODE=live \
              -e CAMVIEW_SECRET_KEY="${CAMVIEW_SECRET_KEY}" \
              -e CAMVIEW_API_KEY="${CAMVIEW_API_KEY}" \
              -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
              "$IMAGE"


            # ------------------------------------------------
            # WAIT FOR APPLICATION
            # ------------------------------------------------

            echo ""
            echo "Waiting for CAMVIEW..."

            SUCCESS=0

            for i in $(seq 1 30); do

              if curl -fsS \
                http://127.0.0.1:5000/api/auth/session \
                > /tmp/camview-session.json; then

                echo "CAMVIEW is responding."

                SUCCESS=1

                break

              fi

              echo "Waiting... $i/30"

              sleep 2

            done


            # ------------------------------------------------
            # FAILURE CHECK
            # ------------------------------------------------

            if [ "$SUCCESS" -ne 1 ]; then

              echo ""
              echo "CAMVIEW failed to start."

              echo ""
              echo "Container status:"

              docker ps -a \
                --filter "name=$CONTAINER"

              echo ""
              echo "Container logs:"

              docker logs "$CONTAINER" || true

              exit 1

            fi


            # ------------------------------------------------
            # CHECK LIVE MODE
            # ------------------------------------------------

            echo ""
            echo "CAMVIEW session response:"

            cat /tmp/camview-session.json

            echo ""

            if ! grep -q '"mode":"live"' /tmp/camview-session.json; then

              echo "ERROR: CAMVIEW is not running in live mode."

              docker logs --tail 100 "$CONTAINER" || true

              exit 1

            fi


            # ------------------------------------------------
            # FINAL STATUS
            # ------------------------------------------------

            echo ""
            echo "Running containers:"

            docker ps \
              --filter "name=$CONTAINER"

            echo ""
            echo "Recent CAMVIEW logs:"

            docker logs --tail 50 "$CONTAINER" || true

            echo ""
            echo "=========================================="
            echo " CAMVIEW DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

        env:

          # GHCR authentication
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # CAMVIEW production secrets
          CAMVIEW_SECRET_KEY: ${{ secrets.CAMVIEW_SECRET_KEY }}
          CAMVIEW_API_KEY: ${{ secrets.CAMVIEW_API_KEY }}
```
