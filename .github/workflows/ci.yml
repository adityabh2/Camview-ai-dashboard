name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q .

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest -q -p no:cacheprovider --durations=10 --junitxml=../test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every ES module
        run: |
          set -e
          count=0

          while IFS= read -r -d '' f; do
            node --experimental-detect-module --check "$f" 2>/dev/null || node --check "$f"
            count=$((count + 1))
          done < <(find frontend/js -name '*.js' -print0)

          echo "Checked $count JavaScript files"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: camview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -e

          docker run -d \
            --name camview \
            -p 5000:5000 \
            -e CAMVIEW_MODE=demo \
            -e CAMVIEW_DEMO_USERS=1 \
            -e CAMVIEW_SECRET_KEY=ci-only-secret \
            -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
            -e CAMVIEW_DEMO_DB_PATH=/app/backend/data/camview-demo.db \
            camview:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/auth/session > /dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:5000/api/auth/session | grep -q '"mode": *"demo"'

          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs camview || true

  publish:
    name: Publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [image]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    needs: [publish]

    steps:
      - name: Deploy CAMVIEW
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e

            echo "=========================================="
            echo "CAMVIEW PRODUCTION DEPLOYMENT"
            echo "=========================================="

            IMAGE="ghcr.io/adityabh2/camview-ai-dashboard:latest"
            CONTAINER="camview"

            echo "Docker:"
            docker --version

            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Pulling latest image..."
            docker pull "$IMAGE"

            echo "Stopping old container..."
            docker rm -f "$CONTAINER" 2>/dev/null || true

            echo "Starting CAMVIEW in LIVE mode..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5000:5000 \
              -e CAMVIEW_MODE=live \
              -e CAMVIEW_SECRET_KEY="${{ secrets.CAMVIEW_SECRET_KEY }}" \
              -e CAMVIEW_API_KEY="${{ secrets.CAMVIEW_API_KEY }}" \
              -e CAMVIEW_DB_PATH=/app/backend/data/camview.db \
              "$IMAGE"

            echo "Waiting for application..."

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5000/api/auth/session > /tmp/camview-session.json; then
                break
              fi

              sleep 2
            done

            echo "Application response:"
            cat /tmp/camview-session.json

            echo
            echo "Checking LIVE mode..."

            grep -q '"mode":"live"' /tmp/camview-session.json

            echo "=========================================="
            echo "CAMVIEW DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            docker ps --filter "name=camview"

            echo
            echo "Recent logs:"
            docker logs --tail 50 "$CONTAINER"
